[package]
name = "scrubr-core"
description = "scrubr's engine: project file, edit log, decoding and encoding, DSP, analysis, peak cache and PNG rendering. No UI dependencies."
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Speech-to-text: Whisper in pure Rust. Off by default, because it brings a machine-learning
# runtime into the build. No model is bundled.
transcribe = ["dep:whisper-candle-core", "dep:hf-hub"]

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
fd-lock = "4"
ebur128 = "0.1"
flacenc = { version = "0.5", default-features = false }
rubato = "5"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
tiny-skia = "0.11"
whisper-candle-core = { version = "0.1.2", optional = true }
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
